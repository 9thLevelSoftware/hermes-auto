name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: this workflow only reads the repository. It publishes no
# packages, pushes no commits, and writes no checks.
permissions:
  contents: read

# Superseded pushes to the same ref are cancelled rather than queued behind a
# result nobody will read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      # A Windows-only failure must not hide a macOS-only failure. Every cell
      # runs to completion so one nightly gives the full picture.
      fail-fast: false
      matrix:
        # Exactly the three platforms the sidecar must supervise.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          # This repository declares its dependencies only in pyproject.toml.
          # Naming it explicitly keeps the cache key deterministic instead of
          # relying on the action's requirements.txt-first fallback order.
          cache-dependency-path: pyproject.toml

      - name: Install the package and its dev extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run the test suite
        run: python -m pytest tests/ -q

  e2e:
    name: Live Hermes surfaces (expected to skip)
    runs-on: ubuntu-latest
    # This job is expected to SKIP every test, and that is the point. The runner
    # has no Hermes installation, so the suite reports "hermes-agent not
    # installed: <paths>" rather than passing vacuously. `-rs` prints the reason
    # for every skip, and the step below copies them into the job summary so the
    # phase's live-surface coverage is visible without opening a log.
    #
    # HERMES_AUTO_E2E is deliberately NOT set here. Setting it would force the
    # suite to run against an absent dependency, and a suite that cannot tell
    # "not configured" from "broken" is the failure mode this job exists to
    # avoid. A skip is not a pass; it is a visible absence.
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package and its dev extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # tee, not a redirect: the reasons must reach both the live log and the
      # summary step, and a summary that swallowed the output would make a
      # crashed run look like an empty one.
      #
      # `set -o pipefail` is load-bearing, not hygiene. Without it the pipeline's
      # exit status is tee's, which is always 0, so a failing suite would report
      # a green job -- the exact "silently reports success" failure this job
      # exists to prevent, reintroduced by the mechanism meant to expose it.
      - name: Run the live surface suite
        run: |
          set -o pipefail
          python -m pytest tests/e2e -q -rs 2>&1 | tee e2e-output.txt

      # `if: always()` so a failing run still reports which surfaces it reached.
      # The skip reasons are the whole product of this job on a runner with no
      # Hermes; losing them on failure would be losing the only output.
      - name: Publish the skip reasons to the job summary
        if: always()
        run: |
          {
            echo "## Live Hermes surface coverage"
            echo
            echo "A skip is **not** a pass. Each line below names a surface that"
            echo "was *not* exercised on this runner, and why."
            echo
            echo '```'
            grep -E '^(SKIPPED|s\b)' e2e-output.txt || cat e2e-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  schema-validation:
    name: Schema payload validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package and its dev extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Identity gate for the focused provider-envelope and wire schemas.
      - name: Assert every schema is discoverable
        run: |
          python -c "from hermes_auto.gateway.schemas import load_schemas, EXPECTED_SCHEMA_IDS as E; s = set(load_schemas()); assert s == set(E), sorted(s ^ set(E))"

  package:
    name: Wheel packaging
    runs-on: ubuntu-latest
    # The schema-validation job above installs the project as EDITABLE, so its
    # SCHEMA_ROOT resolves into the source tree and it proves nothing about what
    # actually ships. `package-data` globs are a common silent packaging failure:
    # drop the "data/schema/**/*.json" line from pyproject.toml and every
    # in-repo gate stays green while the wheel carries zero schemas and
    # load_schemas() returns {} for every installed copy. This job is the only
    # one that inspects and then exercises the built artifact.
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Built into the runner temp directory rather than the workspace so the
      # artifact cannot be confused with a checked-out file or picked up by a
      # later step's glob.
      - name: Build the wheel
        env:
          WHEEL_DIR: ${{ runner.temp }}/dist-check
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel --no-deps -w "$WHEEL_DIR" .

      # Exact identity/count, so a stray addition cannot mask a missing schema.
      - name: Assert the wheel carries the full schema payload
        env:
          WHEEL_DIR: ${{ runner.temp }}/dist-check
        run: |
          python - <<'PY'
          import glob
          import os
          import sys
          import zipfile

          # Single source of truth: the same frozenset the runtime asserts against,
          # read from the source tree so this step needs no install of its own.
          sys.path.insert(0, "src")
          from hermes_auto.gateway.schemas import EXPECTED_SCHEMA_IDS

          wheel_dir = os.environ["WHEEL_DIR"]
          wheels = sorted(glob.glob(os.path.join(wheel_dir, "*.whl")))
          assert len(wheels) == 1, wheels

          names = zipfile.ZipFile(wheels[0]).namelist()
          schemas = sorted(n for n in names if n.endswith(".schema.json"))
          print("\n".join(schemas))
          assert len(schemas) == len(EXPECTED_SCHEMA_IDS), (schemas, sorted(EXPECTED_SCHEMA_IDS))
          assert "hermes_auto/py.typed" in names, sorted(names)
          PY

      # The step that matters. Everything else in this workflow imports from a
      # source tree; this imports from the installed artifact a user would get.
      - name: Install the wheel into a clean virtualenv and load the schemas
        env:
          WHEEL_DIR: ${{ runner.temp }}/dist-check
          VENV_DIR: ${{ runner.temp }}/wheel-venv
        run: |
          python -m venv "$VENV_DIR"
          # bin on the runner; the Scripts fallback lets a maintainer run this
          # exact snippet on the Windows platform the sidecar also supervises.
          if [ -x "$VENV_DIR/bin/python" ]; then
            VENV_PY="$VENV_DIR/bin/python"
          else
            VENV_PY="$VENV_DIR/Scripts/python.exe"
          fi
          # No -e, no PYTHONPATH, and cwd is not the repository root, so an
          # importable hermes_auto can only come from the installed wheel.
          "$VENV_PY" -m pip install --upgrade pip
          "$VENV_PY" -m pip install "$WHEEL_DIR"/*.whl
          cd "$VENV_DIR"
          "$VENV_PY" -c "from hermes_auto.gateway.schemas import load_schemas, EXPECTED_SCHEMA_IDS as E; s = set(load_schemas()); assert s == set(E), sorted(s ^ set(E)); print(len(s), 'schemas loaded from the installed wheel')"
