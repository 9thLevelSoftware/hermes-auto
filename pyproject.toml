[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-auto-router"
description = "Capability-, cost-, cache-, and outcome-aware model routing for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dynamic = ["version"]
dependencies = [
    "packaging>=23.0",
    "jsonschema>=4.20",
    # Imported directly by hermes_auto.gateway.schemas (Registry, Resource,
    # exceptions.Unresolvable). A jsonschema transitive dependency today, but
    # relying on that leaves a direct import undeclared.
    "referencing>=0.30",
    "pyyaml>=6.0",
    # Phase 2 gateway stack. Recorded in
    # .planning/phases/02-provider-plugin-passthrough-gateway/02-CONTEXT.md
    # § Architecture Decision. fastapi, pydantic, psutil and structlog were
    # each considered and explicitly refused there: FastAPI's value is Pydantic
    # request modeling, which silently drops any field it does not model and so
    # defeats the opaque-dict passthrough that makes R5 structurally true.
    "starlette>=0.37",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[project.scripts]
# Load-bearing, not a convenience. `hermes auto ...` is registered by the
# control plugin, and Hermes loads that plugin only when `hermes-auto-control`
# appears in plugins.enabled -- which is what `setup` writes. Without a console
# script there is no way to run `setup` on a fresh install, because the command
# that enables the plugin would itself be provided by the plugin.
hermes-auto = "hermes_auto.cli:main"

[project.entry-points."hermes_agent.plugins"]
# This registers the CONTROL plugin only: slash commands, `hermes auto`
# subcommands, and lifecycle hooks. It does NOT register the model provider.
# Model providers are discovered by scanning
# $HERMES_HOME/plugins/model-providers/, never by entry point
# (02-CONTEXT § VERIFIED HERMES FACTS item 1), and the provider is installed
# there as a shim by `hermes-auto setup`. Conflating the two is the mistake
# design.md §5.1 invites. The key must stay `hermes-auto-control`: Hermes builds
# the plugin manifest with `name=ep.name` and matches plugins.enabled against
# exactly that string.
hermes-auto-control = "hermes_auto.plugin"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.98",
    "pytest-httpx>=0.30",
]

[tool.setuptools.dynamic]
version = {attr = "hermes_auto.version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hermes_auto = [
    "py.typed",
    "data/schema/**/*.json",
    "data/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# pytest-asyncio resolved to 1.4.0, which no longer has a usable default mode:
# without this setting an async test does not fail, it fails to *collect*.
# Set here in Wave 1 because every async test from plan 02-04 onward depends on
# it and no later plan owns this file.
asyncio_mode = "auto"
markers = [
    "contract: protocol contract tests",
    "performance: latency and throughput tests",
    # Registered here in Wave 1: plans 02-07, 02-08 and 02-09 each need one of
    # these, and none of them may edit pyproject.toml, so a marker declared
    # late is a marker that cannot be declared at all.
    "supervisor: process supervision and lifecycle tests",
    "differential: gateway-versus-direct behavioral equivalence tests",
    "e2e: end-to-end tests against a live Hermes installation",
    "slow: tests that are too slow for the default inner loop",
]
