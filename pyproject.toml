[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-auto-router"
description = "Deterministic /model auto routing for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dynamic = ["version"]
dependencies = [
    "packaging>=23.0",
    "jsonschema>=4.20",
    # Imported directly by hermes_auto.gateway.schemas (Registry, Resource,
    # exceptions.Unresolvable). A jsonschema transitive dependency today, but
    # relying on that leaves a direct import undeclared.
    "referencing>=0.30",
    "pyyaml>=6.0",
    # Starlette keeps the OpenAI request body as an opaque mapping. Request
    # models that drop unknown fields would break forward-compatible passthrough.
    "starlette>=0.37",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[project.scripts]
# Load-bearing, not a convenience. `hermes auto ...` is registered by the
# control plugin, and Hermes loads that plugin only when `hermes-auto-control`
# appears in plugins.enabled -- which is what `setup` writes. Without a console
# script there is no way to run `setup` on a fresh install, because the command
# that enables the plugin would itself be provided by the plugin.
hermes-auto = "hermes_auto.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.98",
    "pytest-httpx>=0.30",
]

[tool.setuptools.dynamic]
version = {attr = "hermes_auto.version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hermes_auto = [
    "py.typed",
    "data/schema/**/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# pytest-asyncio resolved to 1.4.0, which no longer has a usable default mode:
# without this setting an async test does not fail, it fails to *collect*.
# Set here in Wave 1 because every async test from plan 02-04 onward depends on
# it and no later plan owns this file.
asyncio_mode = "auto"
markers = [
    "contract: protocol contract tests",
    "performance: latency and throughput tests",
    # Registered here in Wave 1: plans 02-07, 02-08 and 02-09 each need one of
    # these, and none of them may edit pyproject.toml, so a marker declared
    # late is a marker that cannot be declared at all.
    "supervisor: process supervision and lifecycle tests",
    "differential: gateway-versus-direct behavioral equivalence tests",
    "e2e: end-to-end tests against a live Hermes installation",
    "slow: tests that are too slow for the default inner loop",
]
