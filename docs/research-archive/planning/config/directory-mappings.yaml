# Directory mappings — file placement rules for plan validation
# Consumed by wave-executor Step 3.8 to check a plan's files_modified before dispatch.
# Generated by /legion:map at commit 3c9312f.

version: 1
generated_at: 2026-07-27

enforcement:
  strictness: warn   # warn, not strict: Phase 2 introduces gateway/ and state/ modules
                     # that have no precedent in the Phase 1 tree, and a strict gate
                     # would block legitimate new categories.
  exceptions:
    - ".planning/**"
    - "design.md"
    - "README.md"
    - "LICENSE"
    - "SECURITY.md"
    - "CHANGELOG.md"
    - ".gitignore"
    - "pyproject.toml"

mappings:
  package_root:
    description: "The importable distribution. src-layout; nothing outside src/ is packaged."
    paths: ["src/hermes_auto/"]

  json_schema:
    description: "Versioned JSON Schemas, discovered by recursive glob and keyed by $id."
    paths:
      - "src/hermes_auto/data/schema/wire/"      # Hermes<->gateway boundary
      - "src/hermes_auto/data/schema/routing/"   # the router's own evidence records
    conventions:
      - "Filename is {name}.v{N}.schema.json"
      - "$id is https://hermes-auto-router.dev/schema/{wire|routing}/{name}.v{N}.json"
      - "Adding one requires updating EXPECTED_SCHEMA_IDS in gateway/schemas.py in the same commit"

  gateway:
    description: "HTTP surface: app, ingress, relay, upstream client, auth, admin, errors."
    paths: ["src/hermes_auto/gateway/"]
    note: "Only schemas.py exists as of this map. The rest arrives in Phase 2."

  evaluation:
    description: "Offline baseline harness. No network, no credentials."
    paths: ["src/hermes_auto/evaluation/"]

  reserved_subpackages:
    description: "Names reserved by design.md section 17; one-line docstrings until their phase."
    paths:
      - "src/hermes_auto/routing/"      # Phase 4
      - "src/hermes_auto/state/"        # Phase 2 (paths, runtime) then Phase 5
      - "src/hermes_auto/inventory/"    # Phase 3
      - "src/hermes_auto/health/"       # Phase 2 (probe) then Phase 6
      - "src/hermes_auto/adapters/"     # Phase 7
      - "src/hermes_auto/harnesses/"    # Phase 7
      - "src/hermes_auto/telemetry/"    # Phase 2 (redaction) then Phase 8
      - "src/hermes_auto/learning/"     # Phases 9-10

  scripts:
    description: "Operator-facing entry points. No network calls in Phase 1."
    paths: ["scripts/"]

  tests_unit:
    description: "Fast, isolated. No process spawning, no network."
    paths: ["tests/unit/"]

  tests_contract:
    description: "Schema and protocol conformance, with positive and negative fixtures."
    paths: ["tests/contract/"]

  tests_property:
    description: "hypothesis-driven invariants."
    paths: ["tests/property/"]

  tests_integration:
    description: "Real processes, real sockets, mock upstreams."
    paths: ["tests/integration/"]

  tests_performance:
    description: "Determinism and latency gates. Must print measurements, not hide them in assertions."
    paths: ["tests/performance/"]

  tests_e2e:
    description: "Live Hermes surfaces. Skips loudly with a specific reason; a skip is never a pass."
    paths: ["tests/e2e/"]

  tests_fault:
    description: "Injected failures. Reserved for Phase 6."
    paths: ["tests/fault/"]

  fixtures:
    description: "Synthetic test data. No real credentials, model ids, prompts, or paths."
    paths: ["tests/fixtures/"]
    conventions:
      - "wire/ and routing/ hold JSON validated against the frozen schemas"
      - "sse/ holds byte-exact payloads; frame boundaries are the thing under test"
      - "baseline/ holds recorded runs wrapped as {task_id, event}"

  docs:
    description: "Human-facing documentation."
    paths: ["docs/"]
    conventions:
      - "ADRs live in docs/adr/ as NNNN-kebab-title.md"
      - "Every ADR needs Status, Context, Decision, Consequences (Positive and Negative), Alternatives Considered"

  ci:
    description: "GitHub Actions."
    paths: [".github/workflows/"]
    conventions:
      - "permissions: contents: read at workflow level"
      - "actions/checkout with persist-credentials: false"
      - "Repository variables via env:, dereferenced as \"$VAR\" — never interpolated into shell text"
